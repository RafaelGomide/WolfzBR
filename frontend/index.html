<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>WolfzBR</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Tema antes do React montar, para não piscar o claro (src/util/tema.ts).
      (function () {
        var p = null;
        try {
          p = localStorage.getItem("wolfz.tema");
        } catch (e) {}
        if (p !== "claro" && p !== "escuro")
          p =
            window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
              ? "escuro"
              : "claro";
        document.documentElement.dataset.tema = p;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
