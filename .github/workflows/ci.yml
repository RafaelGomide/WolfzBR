name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # Cache do uv (pacotes baixados e wheels) com chave no uv.lock.
      - uses: astral-sh/setup-uv@v10.3.0  # o setup-uv não publica a tag só com a major (v10)
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Com o extra do Tableau: o teste do .hyper roda nas duas plataformas e
      # nos dois Pythons (F3.A5).
      - name: Instalar dependências
        run: uv sync --locked --extra dev --extra tableau

      # Parser oficial de Power Query M, para validar o M gerado (F0.F5).
      # Os runners já têm Node; --ignore-scripts por segurança.
      - name: Instalar parser de M
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/m-parser

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Contratos de import
        run: uv run lint-imports

      - name: Testes
        run: uv run pytest
        env:
          WOLFZ_REQUIRE_M_PARSER: "1"

      - name: Relatório de cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          echo "## Cobertura" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Interface (frontend/): um job só, em Linux. Lint, tipos, build e os
  # fluxos do Playwright contra a API local de verdade (F1.H15).
  interface:
    name: Interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: |
          uv sync --locked
          npm ci --ignore-scripts --no-audit --no-fund

      # O schema.d.ts é gerado do openapi.json (que o pytest confere contra a API).
      - name: Cliente da API em dia
        run: |
          npm run api
          git diff --exit-code src/api/schema.d.ts

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Build (inclui a checagem de tipos)
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
