name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # Cache do uv (pacotes baixados e wheels) com chave no uv.lock.
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependências
        run: uv sync --locked --extra dev

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Contratos de import
        run: uv run lint-imports

      - name: Testes
        run: uv run pytest

      - name: Relatório de cobertura
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          echo "## Cobertura" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
