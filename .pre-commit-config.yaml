repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # O corpus é comparado byte a byte com a fonte e com o gerador.
        exclude: ^tests/corpus/
      # 1 MB: limite de arquivo do corpus (F1.B2); nada maior entra por engano.
      - id: check-added-large-files
        args: [--maxkb=1024]
